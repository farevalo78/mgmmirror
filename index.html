<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MGM - Calculador de Precios Storefront</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>MGM Mirror</h1>
            <p class="subtitle">Calculador de Precios para Storefront</p>
        </header>

        <main class="main-content">
            <div class="form-section">
                <h2>Ingrese los Valores del Storefront</h2>
                
                <div class="form-group">
                    <label for="product-name">Nombre del Producto</label>
                    <input type="text" id="product-name" placeholder="Ej: Espejo Decorativo">
                </div>

                <div class="form-group">
                    <label for="base-price">Precio Base ($)</label>
                    <input type="number" id="base-price" placeholder="0.00" step="0.01" min="0">
                </div>

                <div class="form-group">
                    <label for="installation">Costo de Instalación ($)</label>
                    <input type="number" id="installation" placeholder="0.00" step="0.01" min="0">
                </div>

                <div class="form-group">
                    <label for="materials">Costo de Materiales ($)</label>
                    <input type="number" id="materials" placeholder="0.00" step="0.01" min="0">
                </div>

                <div class="form-group">
                    <label for="labor">Costo de Mano de Obra ($)</label>
                    <input type="number" id="labor" placeholder="0.00" step="0.01" min="0">
                </div>

                <div class="form-group">
                    <label for="other-costs">Otros Costos ($)</label>
                    <input type="number" id="other-costs" placeholder="0.00" step="0.01" min="0">
                </div>

                <button class="btn btn-calculate" onclick="calculatePrice()">Calcular Precio</button>
            </div>

            <div class="results-section" id="results" style="display: none;">
                <h2>Resultados</h2>
                
                <div class="result-item">
                    <span class="label">Suma Total de Costos:</span>
                    <span class="value" id="total-sum">$0.00</span>
                </div>

                <div class="result-item highlight">
                    <span class="label">Precio Final (Suma × 2):</span>
                    <span class="value" id="final-price">$0.00</span>
                </div>

                <div class="result-item">
                    <span class="label">Producto:</span>
                    <span class="value" id="result-product-name">-</span>
                </div>

                <div class="button-group">
                    <button class="btn btn-success" onclick="generateWord()">📄 Generar Documento Word</button>
                    <button class="btn btn-secondary" onclick="resetForm()">Limpiar Formulario</button>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>&copy; 2025 MGM Mirror - Soluciones de Espejos y Decoración</p>
        </footer>
    </div>

    <!-- Librería para generar documentos Word -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/docx/8.5.0/docx.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
